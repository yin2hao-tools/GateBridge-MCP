[project]
name = "astrbot-plugin-gatebridge"
version = "0.1.0"
description = "AstrBot gate commands with menu configuration and administrator/member access control."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["websockets>=15.0.1,<16"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
