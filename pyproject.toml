[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gatebridge-mcp"
version = "0.1.0"
description = "Connect MCP clients to an existing ESP32 gate controller without changing its server or firmware."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.22,<2",
  "pydantic>=2.11,<3",
  "starlette>=0.46,<1",
  "uvicorn>=0.35,<1",
  "websockets>=14.2,<16",
]

[project.scripts]
gatebridge-mcp = "gatebridge_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gatebridge_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
