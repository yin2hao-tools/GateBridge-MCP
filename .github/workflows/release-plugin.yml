name: Release AstrBot plugin

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Compile and package plugin
        run: |
          python3 -m compileall -q main.py gatebridge scripts/package_plugin.py
          python3 scripts/package_plugin.py

      - name: Upload plugin to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/astrbot_plugin_gatebridge.zip --clobber
